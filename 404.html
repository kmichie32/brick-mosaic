<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Brick Mosaic</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='4' width='7' height='5' rx='2' fill='%23d8342b'/%3E%3Crect x='20' y='4' width='7' height='5' rx='2' fill='%23d8342b'/%3E%3Crect x='3' y='8' width='26' height='19' rx='4' fill='%23d8342b'/%3E%3Crect x='3' y='22' width='26' height='5' rx='2' fill='%23000' opacity='.14'/%3E%3C/svg%3E">
<style>
  :root { --paper:#fbf7f0; --ink:#241f1a; --muted:#6f6459; --brand:#d8342b; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--paper); color: var(--ink); text-align: center; padding: 24px;
    font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .brick {
    width: 44px; height: 32px; border-radius: 7px; background: var(--brand);
    position: relative; margin: 0 auto 22px; box-shadow: inset 0 -4px 0 rgba(0,0,0,.14);
  }
  .brick::before, .brick::after {
    content: ''; position: absolute; top: -6px; width: 13px; height: 9px;
    border-radius: 4px 4px 1px 1px; background: var(--brand);
  }
  .brick::before { left: 6px; }
  .brick::after  { right: 6px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 22px; }
  a.btn {
    display: inline-block; background: var(--brand); color: #fff; text-decoration: none;
    font-weight: 700; padding: 12px 22px; border-radius: 12px;
  }
</style>
</head>
<body>
  <main>
    <div class="brick"></div>
    <h1>That page isn't here</h1>
    <p>A missing piece. Let's get you back to the start.</p>
    <a class="btn" href="/">Make a brick mosaic</a>
  </main>
</body>
</html>
